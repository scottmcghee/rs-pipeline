# Offline demo: PostgreSQL plus the pipeline running over a fictional market.
#
#   docker compose up --build                     # seed, run every step, print the leaders
#   docker compose run --rm pipeline top -n 10    # any rs-pipeline command
#   docker compose down -v                        # remove the demo database
name: rs-pipeline-demo

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: stocks
      POSTGRES_PASSWORD: demo
    ports:
      # psql -h localhost -p 54320 -U postgres stocks (DEMO_DB_PORT changes the port)
      - "127.0.0.1:${DEMO_DB_PORT:-54320}:5432"
    stop_grace_period: 30s
    volumes:
      # The postgres 18+ image keeps its data in a versioned directory under
      # this one. Rename the volume (pgdata19, ...) when the image's major
      # version changes: the new server refuses to start over old data files.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      # Over TCP: during first-time setup the image runs a temporary server on the
      # Unix socket only, which a socket check would already report as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "stocks"]
      # First-time setup can take a minute or more on a busy machine; failed
      # checks during the start period don't count.
      start_period: 180s
      start_interval: 1s
      interval: 2s
      timeout: 3s
      retries: 30

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: stocks
      DB_PASSWORD: demo
      RS_SOURCE: synthetic
      RS_REF_TICKER: MKT
      RS_BENCHMARK_TICKERS: MKT
      RS_HISTORY_START: "2022-01-03"
    command: ["demo"]

volumes:
  pgdata18:
